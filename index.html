<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MistakeAI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 頂部標題 -->
    <header class="top-bar">
        <h1>MistakeAI <span class="badge">HKDSE</span></h1>
    </header>

    <!-- 頁面 1：主頁 (Home) -->
    <section id="home" class="page-section" style="display: block;">
        <div class="welcome-card">
            <h2>Welcome Back! 📚</h2>
            <p>Turn your mistakes into your highest scoring points.</p >
            <button class="primary-btn" onclick="switchTab('add')">+ Add New Mistake</button>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h3 id="total-count">0</h3>
                <p>Total Saved</p >
            </div>
        </div>
    </section>

    <!-- 頁面 2：查看錯題 (Mistakes) -->
    <section id="mistakes" class="page-section" style="display: none;">
        <h2>My Saved Mistakes</h2>
        <div id="mistakes-list"></div>
    </section>

    <!-- 頁面 3：新增錯題 (Add) -->
    <section id="add" class="page-section" style="display: none;">
        <h2>Add Mistake</h2>
        
        <label for="subject-select">Select Subject</label>
        <select id="subject-select" class="input-field">
            <option value="Mathematics">Mathematics</option>
            <option value="English">English</option>
            <option value="Chinese">Chinese</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
        </select>

        <label for="image-input">Upload Photo</label>
        <input type="file" id="image-input" accept="image/*" class="input-field">

        <button id="save-btn" class="primary-btn">Save Mistake Photo</button>
    </section>

    <!-- 底部導覽列 (Bottom Nav) -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home')">
            <span>🏠</span>
            <span>Home</span>
        </button>
        <button class="nav-item" onclick="switchTab('mistakes')">
            <span>📚</span>
            <span>Mistakes</span>
        </button>
        <button class="nav-item" onclick="switchTab('add')">
            <span>➕</span>
            <span>Add</span>
        </button>
    </nav>

    <script src="app.js"></script>
</body>
</html>
